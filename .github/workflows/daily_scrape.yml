name: Twice-Daily Market Scrape & Datapoint Archive

on:
  schedule:
    - cron: '0 15 * * *' # Morning window: 10:00 AM EST / 7:00 AM PST
    - cron: '0 2 * * *'  # Evening window: 9:00 PM EST / 6:00 PM PST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run live Market Listings + sequential Affiliate Creators scrape & update snapshot
        run: python app.py --scrape-only

      - name: Commit and push updated datapoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market_research.db static/snapshot.json index.html
          git diff --staged --quiet || git commit -m "Automated daily scrape: archive new market & affiliate creator datapoints"
          git push origin main
